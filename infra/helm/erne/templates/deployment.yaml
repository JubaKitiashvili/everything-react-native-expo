apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erne-monitor.fullname" . }}
  labels:
    {{- include "erne-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if and .Values.persistence.enabled (eq (int .Values.replicaCount) 1) }}
  strategy:
    # SQLite on a RWO PVC cannot be mounted by two pods at once, so a rolling
    # update would deadlock on the volume. Recreate avoids that.
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "erne-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "erne-monitor.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "erne-monitor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if or .Values.secret.create .Values.secret.existingSecret }}
            {{- if .Values.secret.erneApiKey }}
            - name: ERNE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "erne-monitor.secretName" . }}
                  key: ERNE_API_KEY
            {{- end }}
            {{- if .Values.secret.erneWebhookSecret }}
            - name: ERNE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "erne-monitor.secretName" . }}
                  key: ERNE_WEBHOOK_SECRET
            {{- end }}
            {{- if .Values.secret.databaseUrl }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "erne-monitor.secretName" . }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.secret.redisUrl }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "erne-monitor.secretName" . }}
                  key: REDIS_URL
            {{- end }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "erne-monitor.fullname" .) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
