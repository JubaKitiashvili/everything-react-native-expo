{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "erne-monitor.fullname" . }}
  labels:
    {{- include "erne-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.erneApiKey }}
  ERNE_API_KEY: {{ .Values.secret.erneApiKey | quote }}
  {{- end }}
  {{- if .Values.secret.erneWebhookSecret }}
  ERNE_WEBHOOK_SECRET: {{ .Values.secret.erneWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secret.databaseUrl }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secret.redisUrl }}
  REDIS_URL: {{ .Values.secret.redisUrl | quote }}
  {{- end }}
{{- end }}
